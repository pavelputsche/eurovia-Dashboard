<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Eurovia Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script type="module">
        import AppLayout from '../components/AppLayout.js';
        import { utils, mockData } from '../js/common.js';

        const { createApp, ref, computed, onMounted } = Vue;

        const DashboardApp = {
            components: {
                AppLayout
            },
            setup() {
                const stats = ref({
                    myPermissions: 27,
                    expiringSoon: 21,
                    connectedApps: 5,
                    avgDaysToRenew: 22,
                    pendingRequests: 3,
                    accessHealth: 93
                });

                const recentActivity = ref([
                    { action: 'Slack integration updated', time: '2h ago' },
                    { action: '3 permissions approved', time: '3h ago' },
                    { action: 'Weekly review completed', time: '1d ago' },
                    { action: 'CRM access renewed', time: '2d ago' },
                    { action: 'New app connected', time: '3d ago' }
                ]);

                const alerts = ref([
                    { type: 'urgent', message: 'Urgent: 2 expiring tomorrow', emoji: '⚠️' },
                    { type: 'warning', message: 'Review: 5 pending requests', emoji: '📋' },
                    { type: 'info', message: 'Info: Security review due', emoji: '🔒' }
                ]);

                const quickActions = ref([
                    { title: 'New Request', icon: 'fas fa-plus', action: 'new-request', class: 'primary' },
                    { title: 'Renew All', icon: 'fas fa-sync', action: 'renew-all', class: 'secondary' },
                    { title: 'Revoke Access', icon: 'fas fa-ban', action: 'revoke-access', class: 'danger' }
                ]);

                const handleQuickAction = (action) => {
                    switch(action) {
                        case 'new-request':
                            window.location.href = 'request-access.html';
                            break;
                        case 'renew-all':
                            window.location.href = 'renew-permissions.html';
                            break;
                        case 'revoke-access':
                            if (confirm('Are you sure you want to revoke access?')) {
                                utils.showNotification('Access revoked successfully', 'warning');
                            }
                            break;
                    }
                };

                const handleActionBtnClick = (action) => {
                    handleQuickAction(action);
                };

                return {
                    stats,
                    recentActivity,
                    alerts,
                    quickActions,
                    handleQuickAction,
                    handleActionBtnClick
                };
            },
            template: `
                <AppLayout page-title="Dashboard" current-page="dashboard" @quick-action="handleQuickAction">
                    <div class="dashboard-content">
                        <!-- Top Tile - Full Width -->
                        <div class="tile tile-full-width">
                            <div class="tile-header">
                                <h2>Overview & Account Summary</h2>
                                <i class="fas fa-chart-line"></i>
                            </div>
                            <div class="tile-content">
                                <div class="overview-grid">
                                    <!-- Left Section - Permission Stats -->
                                    <div class="permission-stats">
                                        <div class="stat-card">
                                            <div class="stat-number">{{ stats.myPermissions }}</div>
                                            <div class="stat-label">My Permissions</div>
                                            <div class="stat-sublabel">↗ 2 this month</div>
                                        </div>
                                        <div class="stat-card">
                                            <div class="stat-number">{{ stats.expiringSoon }}</div>
                                            <div class="stat-label">Expiring Soon</div>
                                        </div>
                                        <div class="stat-card">
                                            <div class="stat-number">{{ stats.connectedApps }}</div>
                                            <div class="stat-label">Connected Apps</div>
                                            <div class="stat-sublabel">3 inactive</div>
                                        </div>
                                        <div class="stat-card">
                                            <div class="stat-number">{{ stats.avgDaysToRenew }}</div>
                                            <div class="stat-label">Avg Days to Renew</div>
                                        </div>
                                        <div class="stat-card">
                                            <div class="stat-number">{{ stats.pendingRequests }}</div>
                                            <div class="stat-label">Pending Requests</div>
                                            <div class="stat-sublabel">Awaiting approval</div>
                                        </div>
                                        <div class="stat-card">
                                            <div class="stat-number">{{ stats.accessHealth }}%</div>
                                            <div class="stat-label">Access Health</div>
                                        </div>
                                        <div class="stat-card account-status">
                                            <div class="status-label">Account Active</div>
                                        </div>
                                    </div>

                                    <!-- Middle Section - Recent Activity -->
                                    <div class="recent-activity">
                                        <h4>Recent Activity</h4>
                                        <div class="activity-list">
                                            <div 
                                                v-for="activity in recentActivity" 
                                                :key="activity.action"
                                                class="activity-item"
                                            >
                                                <span class="activity-text">{{ activity.action }}</span>
                                                <span class="activity-time">{{ activity.time }}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Right Section - Alerts -->
                                    <div class="alerts-section">
                                        <h4>Alerts</h4>
                                        <div class="alert-list">
                                            <div 
                                                v-for="alert in alerts" 
                                                :key="alert.message"
                                                class="alert-item"
                                                :class="alert.type"
                                            >
                                                <div class="alert-icon">{{ alert.emoji }}</div>
                                                <div class="alert-content">
                                                    <div class="alert-title">{{ alert.message }}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Row Tiles -->
                        <div class="tiles-row">
                            <!-- Sharing Permissions Tile -->
                            <div class="tile">
                                <div class="tile-header">
                                    <h3>Sharing Permissions</h3>
                                    <i class="fas fa-share-alt"></i>
                                </div>
                                <div class="tile-content">
                                    <div class="permission-list">
                                        <div class="permission-item">
                                            <div class="permission-icon">
                                                <i class="fas fa-chart-bar"></i>
                                            </div>
                                            <div class="permission-info">
                                                <span class="permission-name">Account Balance</span>
                                                <span class="permission-apps">3 apps</span>
                                            </div>
                                        </div>
                                        <div class="permission-item">
                                            <div class="permission-icon">
                                                <i class="fas fa-exchange-alt"></i>
                                            </div>
                                            <div class="permission-info">
                                                <span class="permission-name">Transaction History</span>
                                                <span class="permission-apps">2 apps</span>
                                            </div>
                                        </div>
                                        <div class="permission-item">
                                            <div class="permission-icon">
                                                <i class="fas fa-user"></i>
                                            </div>
                                            <div class="permission-info">
                                                <span class="permission-name">Profile Information</span>
                                                <span class="permission-apps">5 apps</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Quick Actions Tile -->
                            <div class="tile">
                                <div class="tile-header">
                                    <h3>Quick Actions</h3>
                                    <i class="fas fa-bolt"></i>
                                </div>
                                <div class="tile-content">
                                    <div class="action-buttons">
                                        <button 
                                            v-for="action in quickActions"
                                            :key="action.action"
                                            class="action-btn"
                                            :class="action.class"
                                            @click="handleActionBtnClick(action.action)"
                                        >
                                            <i :class="action.icon"></i>
                                            {{ action.title }}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Third Parties Tile -->
                            <div class="tile">
                                <div class="tile-header">
                                    <h3>Third Parties</h3>
                                    <i class="fas fa-building"></i>
                                </div>
                                <div class="tile-content">
                                    <div class="third-party-list">
                                        <div class="third-party-item">
                                            <div class="third-party-avatar">
                                                <i class="fas fa-mobile-alt"></i>
                                            </div>
                                            <div class="third-party-info">
                                                <span class="third-party-name">PaymentApp Pro</span>
                                                <span class="third-party-status active">Active</span>
                                            </div>
                                        </div>
                                        <div class="third-party-item">
                                            <div class="third-party-avatar">
                                                <i class="fas fa-chart-pie"></i>
                                            </div>
                                            <div class="third-party-info">
                                                <span class="third-party-name">BudgetTracker</span>
                                                <span class="third-party-status active">Active</span>
                                            </div>
                                        </div>
                                        <div class="third-party-item">
                                            <div class="third-party-avatar">
                                                <i class="fas fa-credit-card"></i>
                                            </div>
                                            <div class="third-party-info">
                                                <span class="third-party-name">ExpenseManager</span>
                                                <span class="third-party-status pending">Pending</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </AppLayout>
            `
        };

        createApp(DashboardApp).mount('#app');
    </script>
</body>
</html>
