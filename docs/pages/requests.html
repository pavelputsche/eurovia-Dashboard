<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Requests - Eurovia Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script type="module">
        import AppLayout from '../components/AppLayout.js';
        import { utils, mockData } from '../js/common.js';

        const { createApp, ref, computed, onMounted } = Vue;

        const RequestsApp = {
            components: {
                AppLayout
            },
            setup() {
                const activeTab = ref('pending');
                
                // Pending access requests from institutions
                const pendingRequests = ref([
                    {
                        id: 1,
                        appName: 'Deutsche Rentenversicherung',
                        icon: 'drv',
                        requestDate: '2025-10-14',
                        status: 'New Request',
                        permissions: ['Investment portfolio overview', 'Account balance information', 'Transaction history (last 12 months)', 'Personal identification data'],
                        verified: true,
                        description: 'Deutsche Rentenversicherung is requesting access to view your investment portfolio for pension calculation purposes.',
                        duration: '1 year'
                    },
                    {
                        id: 2,
                        appName: 'Investment Advisor Pro',
                        icon: 'invest',
                        requestDate: '2025-09-20',
                        status: 'Pending',
                        permissions: ['Portfolio Overview & Performance'],
                        verified: true,
                        description: 'Investment Advisor Pro wants to analyze your portfolio performance and provide personalized investment recommendations.',
                        duration: '1 year'
                    },
                    {
                        id: 3,
                        appName: 'Crypto Portfolio Tracker',
                        icon: 'crypto',
                        requestDate: '2025-10-18',
                        status: 'Pending',
                        permissions: ['Cryptocurrency Holdings & Transactions'],
                        verified: true,
                        description: 'Crypto Portfolio Tracker requests access to your cryptocurrency transactions for comprehensive portfolio analysis.',
                        duration: '6 months'
                    }
                ]);

                const spamRequests = ref([
                    {
                        id: 4,
                        appName: 'QuickRich Investment',
                        icon: 'suspicious',
                        requestDate: '2025-10-19',
                        status: 'Spam',
                        permissions: ['Complete financial profile', 'Investment history and holdings', 'Personal identification data', 'Account access credentials'],
                        verified: false,
                        description: '⚠️ WARNING: QuickRich Investment is an unverified entity requesting extensive access to your financial data. This appears to be a fraudulent investment scheme.',
                        spamFlags: ['Unverified domain', 'Suspicious request pattern', 'Excessive permissions requested']
                    },
                    {
                        id: 5,
                        appName: 'CryptoMiner Express',
                        icon: 'crypto-fake',
                        requestDate: '2025-10-21',
                        status: 'Spam',
                        permissions: ['Account Access & Transaction Authorization'],
                        verified: false,
                        description: 'Suspicious cryptocurrency mining service requesting unauthorized access.',
                        spamFlags: ['No business license found', 'Requesting transaction authorization', 'Recent domain registration']
                    }
                ]);

                const filteredRequests = computed(() => {
                    return activeTab.value === 'pending' ? pendingRequests.value : spamRequests.value;
                });

                const handleApproveRequest = (requestId) => {
                    const request = pendingRequests.value.find(r => r.id === requestId);
                    if (request && confirm(`Grant access to ${request.appName}?`)) {
                        request.status = 'Approved';
                        pendingRequests.value = pendingRequests.value.filter(r => r.id !== requestId);
                        utils.showNotification(`Access granted to ${request.appName}`, 'success');
                    }
                };

                const handleRejectRequest = (requestId) => {
                    const request = pendingRequests.value.find(r => r.id === requestId);
                    if (request && confirm(`Decline access request from ${request.appName}?`)) {
                        pendingRequests.value = pendingRequests.value.filter(r => r.id !== requestId);
                        utils.showNotification(`${request.appName} request declined`, 'warning');
                    }
                };

                const getInstitutionLogo = (icon) => {
                    const logoMap = {
                        'drv': 'DRV',
                        'invest': 'INV', 
                        'crypto': 'CRY',
                        'suspicious': 'SUS',
                        'crypto-fake': 'MIN'
                    };
                    return logoMap[icon] || icon.toUpperCase().slice(0,3);
                };

                const handleQuickAction = (action) => {
                    switch(action) {
                        case 'request-access':
                            window.location.href = 'request-access.html';
                            break;
                        case 'renew-permissions':
                            window.location.href = 'renew-permissions.html';
                            break;
                        default:
                            utils.showNotification(`${action} functionality would be implemented here`, 'info');
                    }
                };

                return {
                    activeTab,
                    pendingRequests,
                    spamRequests,
                    filteredRequests,
                    handleApproveRequest,
                    handleRejectRequest,
                    handleQuickAction,
                    getInstitutionLogo,
                    utils
                };
            },
            template: `
                <AppLayout page-title="Access Requests" current-page="requests" @quick-action="handleQuickAction">
                    <!-- Requests Header -->
                    <div class="requests-header">
                        <div class="tab-navigation">
                            <button 
                                @click="activeTab = 'pending'"
                                class="tab-btn"
                                :class="{ 'active': activeTab === 'pending' }"
                            >
                                <i class="fas fa-inbox"></i>
                                Pending Requests
                                <span class="badge">{{ pendingRequests.length }}</span>
                            </button>
                            <button 
                                @click="activeTab = 'spam'"
                                class="tab-btn"
                                :class="{ 'active': activeTab === 'spam' }"
                            >
                                <i class="fas fa-shield-alt"></i>
                                Spam Detection
                                <span class="badge warning">{{ spamRequests.length }}</span>
                            </button>
                        </div>
                    </div>

                    <!-- Requests List -->
                    <div class="requests-grid" v-if="activeTab === 'pending'">
                        <div 
                            v-for="request in filteredRequests" 
                            :key="request.id"
                            class="permission-card request"
                            :class="{ 'request': true }"
                        >
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo" :class="request.icon">
                                        {{ getInstitutionLogo(request.icon) }}
                                    </div>
                                    <div class="institution-details">
                                        <h3>{{ request.appName }}</h3>
                                        <div class="verification-badge">
                                            <i class="fas fa-check-circle" v-if="request.verified"></i>
                                            <i class="fas fa-exclamation-triangle" v-else></i>
                                            <span>{{ request.verified ? 'Verified' : 'Unverified' }}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="request-badge" :class="{ 'new': request.status === 'New Request' }">
                                    {{ request.status }}
                                </div>
                            </div>

                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-chart-line"></i>
                                    <span>{{ request.permissions[0] }}</span>
                                </div>
                                <div class="permission-duration">
                                    <span>Requested: {{ utils.formatDate(request.requestDate) }}</span>
                                    <span>Duration: {{ request.duration }}</span>
                                </div>
                                <div class="request-details">
                                    <p>{{ request.description }}</p>
                                </div>
                            </div>

                            <div class="permission-actions">
                                <button @click="handleApproveRequest(request.id)" class="btn-approve">
                                    {{ request.appName.includes('Deutsche') ? 'Zugriff gewähren' : 'Grant Access' }}
                                </button>
                                <button @click="handleRejectRequest(request.id)" class="btn-decline">
                                    {{ request.appName.includes('Deutsche') ? 'Ablehnen' : 'Decline' }}
                                </button>
                                <button class="btn-info">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Spam Requests -->
                    <div v-else class="requests-grid">
                        <div class="spam-info">
                            <div class="spam-warning">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span>These requests are from unverified sources and have been automatically flagged as potential spam.</span>
                            </div>
                        </div>
                        
                        <div 
                            v-for="request in filteredRequests" 
                            :key="request.id"
                            class="permission-card request spam"
                        >
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo" :class="request.icon">
                                        {{ getInstitutionLogo(request.icon) }}
                                    </div>
                                    <div class="institution-details">
                                        <h3>{{ request.appName }}</h3>
                                        <div class="verification-badge unverified">
                                            <i class="fas fa-exclamation-triangle"></i>
                                            <span>Unverified</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="request-badge spam">Spam</div>
                            </div>

                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-money-bill-wave"></i>
                                    <span>{{ request.permissions[0] }}</span>
                                </div>
                                <div class="permission-duration">
                                    <span>Requested: {{ utils.formatDate(request.requestDate) }}</span>
                                    <span>Duration: Permanent</span>
                                </div>
                                <div class="spam-flags" v-if="request.spamFlags">
                                    <div class="flag-item" v-for="flag in request.spamFlags" :key="flag">
                                        ⚠️ {{ flag }}
                                    </div>
                                </div>
                            </div>

                            <div class="permission-actions">
                                <button class="btn-approve">Allow Request</button>
                                <button class="btn-block">Block Permanently</button>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div v-if="filteredRequests.length === 0" class="empty-state">
                        <i class="fas fa-inbox" v-if="activeTab === 'pending'"></i>
                        <i class="fas fa-shield-alt" v-else></i>
                        <h3 v-if="activeTab === 'pending'">No pending requests</h3>
                        <h3 v-else>No spam detected</h3>
                        <p v-if="activeTab === 'pending'">All access requests have been reviewed</p>
                        <p v-else>Our security filters are working properly</p>
                    </div>
                </AppLayout>
            `
        };

        createApp(RequestsApp).mount('#app');
    </script>
</body>
</html>
