<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Requests - Eurovia Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script type="module">
        import AppLayout from '../components/AppLayout.js';
        import { utils, mockData } from '../js/common.js';

        const { createApp, ref, computed, onMounted } = Vue;

        const RequestsApp = {
            components: {
                AppLayout
            },
            setup() {
                const activeTab = ref('pending');
                const requests = ref(mockData.requests);
                const spamRequests = ref([
                    {
                        id: 3,
                        appName: 'FakeBank',
                        icon: 'fas fa-exclamation-triangle',
                        requestDate: '2024-10-18',
                        status: 'Spam',
                        permissions: ['Full account access', 'Password reset'],
                        verified: false
                    }
                ]);

                const filteredRequests = computed(() => {
                    return activeTab.value === 'pending' ? requests.value : spamRequests.value;
                });

                const handleApproveRequest = (requestId) => {
                    const request = requests.value.find(r => r.id === requestId);
                    if (request && confirm(`Approve access request for ${request.appName}?`)) {
                        request.status = 'Approved';
                        utils.showNotification(`${request.appName} request approved!`, 'success');
                    }
                };

                const handleRejectRequest = (requestId) => {
                    const request = requests.value.find(r => r.id === requestId);
                    if (request && confirm(`Reject access request for ${request.appName}?`)) {
                        requests.value = requests.value.filter(r => r.id !== requestId);
                        utils.showNotification(`${request.appName} request rejected`, 'warning');
                    }
                };

                const handleQuickAction = (action) => {
                    switch(action) {
                        case 'request-access':
                            window.location.href = 'request-access.html';
                            break;
                        case 'renew-permissions':
                            window.location.href = 'renew-permissions.html';
                            break;
                        default:
                            utils.showNotification(`${action} functionality would be implemented here`, 'info');
                    }
                };

                return {
                    activeTab,
                    requests,
                    spamRequests,
                    filteredRequests,
                    handleApproveRequest,
                    handleRejectRequest,
                    handleQuickAction,
                    utils
                };
            },
            template: `
                <AppLayout page-title="Access Requests" current-page="requests" @quick-action="handleQuickAction">
                    <!-- Requests Header -->
                    <div class="requests-header">
                        <div class="tab-navigation">
                            <button 
                                @click="activeTab = 'pending'"
                                class="tab-btn"
                                :class="{ 'active': activeTab === 'pending' }"
                            >
                                <i class="fas fa-clock"></i>
                                Pending Requests
                                <span class="badge">{{ requests.length }}</span>
                            </button>
                            <button 
                                @click="activeTab = 'spam'"
                                class="tab-btn"
                                :class="{ 'active': activeTab === 'spam' }"
                            >
                                <i class="fas fa-shield-alt"></i>
                                Spam Detection
                                <span class="badge warning">{{ spamRequests.length }}</span>
                            </button>
                        </div>
                    </div>

                    <!-- Requests List -->
                    <div class="requests-list">
                        <div 
                            v-for="request in filteredRequests" 
                            :key="request.id"
                            class="request-card"
                            :class="{ 'spam': activeTab === 'spam' }"
                        >
                            <div class="card-header">
                                <div class="app-info">
                                    <div class="app-icon" :class="{ 'warning': !request.verified }">
                                        <i :class="request.icon"></i>
                                    </div>
                                    <div class="app-details">
                                        <h3 class="app-name">{{ request.appName }}</h3>
                                        <div class="app-verification">
                                            <i class="fas fa-check-circle" v-if="request.verified"></i>
                                            <i class="fas fa-exclamation-triangle" v-else></i>
                                            <span>{{ request.verified ? 'Verified' : 'Unverified Source' }}</span>
                                        </div>
                                        <div class="request-date">
                                            Requested {{ utils.formatTimeAgo(request.requestDate) }}
                                        </div>
                                    </div>
                                </div>
                                <div class="request-status" :class="request.status.toLowerCase()">
                                    {{ request.status }}
                                </div>
                            </div>

                            <div class="card-content">
                                <div class="permissions-list">
                                    <h4>Requested Permissions:</h4>
                                    <ul>
                                        <li v-for="permission in request.permissions" :key="permission">
                                            <i class="fas fa-key"></i>
                                            {{ permission }}
                                        </li>
                                    </ul>
                                </div>
                            </div>

                            <div class="card-actions" v-if="activeTab === 'pending'">
                                <button @click="handleApproveRequest(request.id)" class="btn-approve">
                                    <i class="fas fa-check"></i>
                                    Approve
                                </button>
                                <button @click="handleRejectRequest(request.id)" class="btn-reject">
                                    <i class="fas fa-times"></i>
                                    Reject
                                </button>
                                <button class="btn-details">
                                    <i class="fas fa-info-circle"></i>
                                    Details
                                </button>
                            </div>

                            <div class="card-actions" v-else>
                                <button class="btn-reject">
                                    <i class="fas fa-ban"></i>
                                    Block Permanently
                                </button>
                                <button class="btn-details">
                                    <i class="fas fa-eye"></i>
                                    Review
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div v-if="filteredRequests.length === 0" class="empty-state">
                        <i class="fas fa-inbox" v-if="activeTab === 'pending'"></i>
                        <i class="fas fa-shield-alt" v-else></i>
                        <h3 v-if="activeTab === 'pending'">No pending requests</h3>
                        <h3 v-else>No spam detected</h3>
                        <p v-if="activeTab === 'pending'">All access requests have been reviewed</p>
                        <p v-else>Our security filters are working properly</p>
                    </div>
                </AppLayout>
            `
        };

        createApp(RequestsApp).mount('#app');
    </script>
</body>
</html>
