<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renew Permissions - Eurovia Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script type="module">
        import AppLayout from '../components/AppLayout.js';
        import { utils, mockData } from '../js/common.js';

        const { createApp, ref, computed, onMounted } = Vue;

        const RenewPermissionsApp = {
            components: {
                AppLayout
            },
            setup() {
                const handleQuickAction = (action) => {
                    switch(action) {
                        case 'request-access':
                            window.location.href = 'request-access.html';
                            break;
                        default:
                            utils.showNotification(`${action} functionality would be implemented here`, 'info');
                    }
                };

                return {
                    handleQuickAction,
                    utils
                };
            },
            template: `
                <AppLayout page-title="Renew Permissions" current-page="renew-permissions" @quick-action="handleQuickAction">
                    <div class="permissions-grid">
                        <!-- BudgetTracker -->
                        <div class="permission-card active">
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo budget">BT</div>
                                    <div class="institution-details">
                                        <h3>BudgetTracker</h3>
                                        <div class="verification-badge">
                                            <i class="fas fa-check-circle"></i>
                                            <span>Verified</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="permission-status expiring">Expiring Soon</div>
                            </div>
                            
                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-chart-pie"></i>
                                    <span>Account Balance & Categories</span>
                                </div>
                                <div class="permission-duration">
                                    <span>15.06.2025 - 25.10.2025</span>
                                </div>
                            </div>
                            
                            <div class="permission-actions">
                                <button class="btn-renew">Renew Access</button>
                                <button class="btn-revoke">Revoke</button>
                            </div>
                        </div>
                    </div>
                </AppLayout>
            `
        };

        createApp(RenewPermissionsApp).mount('#app');
    </script>
</body>
</html>
