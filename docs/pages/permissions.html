<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Permissions - Eurovia Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script type="module">
        import AppLayout from '../components/AppLayout.js';
        import { utils, mockData } from '../js/common.js';

        const { createApp, ref, computed, onMounted } = Vue;

        const PermissionsApp = {
            components: {
                AppLayout
            },
            setup() {
                const handleQuickAction = (action) => {
                    switch(action) {
                        case 'renew-permissions':
                            window.location.href = 'renew-permissions.html';
                            break;
                        case 'request-access':
                            window.location.href = 'request-access.html';
                            break;
                        default:
                            utils.showNotification(`${action} functionality would be implemented here`, 'info');
                    }
                };

                return {
                    handleQuickAction,
                    utils
                };
            },
            template: `
                <AppLayout page-title="My Permissions" current-page="permissions" @quick-action="handleQuickAction">
                    <!-- Permissions Header -->
                    <div class="permissions-header">
                        <h2>My Permissions</h2>
                        <div class="permissions-summary">
                            <span class="total-permissions">{{ stats.active }} Active Permissions</span>
                            <span class="expiring-soon">{{ stats.expiring }} Expiring Soon</span>
                        </div>
                    </div>

                    <!-- Permissions Grid -->
                    <div class="permissions-grid">
                        <!-- PaymentApp Pro -->
                        <div class="permission-card active">
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo payment">PAY</div>
                                    <div class="institution-details">
                                        <h3>PaymentApp Pro</h3>
                                        <div class="verification-badge">
                                            <i class="fas fa-check-circle"></i>
                                            <span>Verified</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="permission-status active">Active</div>
                            </div>
                            
                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-credit-card"></i>
                                    <span>Transaction History & Balance</span>
                                </div>
                                <div class="permission-duration">
                                    <span>01.08.2025 - 01.08.2026</span>
                                </div>
                            </div>
                            
                            <div class="permission-actions">
                                <button class="btn-manage">Manage Access</button>
                                <button class="btn-revoke">Revoke</button>
                            </div>
                        </div>

                        <!-- BudgetTracker -->
                        <div class="permission-card active">
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo budget">BT</div>
                                    <div class="institution-details">
                                        <h3>BudgetTracker</h3>
                                        <div class="verification-badge">
                                            <i class="fas fa-check-circle"></i>
                                            <span>Verified</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="permission-status expiring">Expiring Soon</div>
                            </div>
                            
                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-chart-pie"></i>
                                    <span>Account Balance & Categories</span>
                                </div>
                                <div class="permission-duration">
                                    <span>15.06.2025 - 25.10.2025</span>
                                </div>
                            </div>
                            
                            <div class="permission-actions">
                                <button class="btn-renew">Renew Access</button>
                                <button class="btn-revoke">Revoke</button>
                            </div>
                        </div>

                        <!-- Tax Service -->
                        <div class="permission-card active">
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo tax">TAX</div>
                                    <div class="institution-details">
                                        <h3>TaxService Digital</h3>
                                        <div class="verification-badge">
                                            <i class="fas fa-check-circle"></i>
                                            <span>Verified</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="permission-status active">Active</div>
                            </div>
                            
                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-file-invoice-dollar"></i>
                                    <span>Annual Statements & Tax Documents</span>
                                </div>
                                <div class="permission-duration">
                                    <span>01.01.2025 - 31.12.2025</span>
                                </div>
                            </div>
                            
                            <div class="permission-actions">
                                <button class="btn-manage">Manage Access</button>
                                <button class="btn-revoke">Revoke</button>
                            </div>
                        </div>

                        <!-- Insurance Portal -->
                        <div class="permission-card active">
                            <div class="permission-header">
                                <div class="institution-info">
                                    <div class="institution-logo insurance">INS</div>
                                    <div class="institution-details">
                                        <h3>Insurance Portal</h3>
                                        <div class="verification-badge">
                                            <i class="fas fa-check-circle"></i>
                                            <span>Verified</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="permission-status expiring">Expiring Soon</div>
                            </div>
                            
                            <div class="permission-details">
                                <div class="permission-type">
                                    <i class="fas fa-shield-alt"></i>
                                    <span>Policy Information & Claims</span>
                                </div>
                                <div class="permission-duration">
                                    <span>10.05.2025 - 28.10.2025</span>
                                </div>
                            </div>
                            
                            <div class="permission-actions">
                                <button class="btn-renew">Renew Access</button>
                                <button class="btn-revoke">Revoke</button>
                            </div>
                        </div>
                    </div>
                </AppLayout>
            `
        };

        createApp(PermissionsApp).mount('#app');
    </script>
</body>
</html>
