<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access - Eurovia Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script type="module">
        import AppLayout from '../components/AppLayout.js';
        import { utils, mockData } from '../js/common.js';

        const { createApp, ref, computed, onMounted } = Vue;

        // Global function for onclick handlers
        window.requestAccess = function(institutionId) {
            const institutions = {
                'paymentapp': 'PaymentApp Pro',
                'budgettracker': 'BudgetTracker',
                'expensemanager': 'ExpenseManager',
                'investmenttracker': 'InvestmentTracker',
                'taxhelper': 'TaxHelper',
                'creditmonitor': 'CreditMonitor'
            };
            
            const institutionName = institutions[institutionId];
            
            if (confirm(`Do you want to request additional permissions from ${institutionName}?`)) {
                utils.showNotification(`Access request sent to ${institutionName}`, 'success');
                
                // Simulate updating the UI after a delay
                setTimeout(() => {
                    utils.showNotification(`${institutionName} will review your request within 24 hours`, 'info');
                }, 2000);
            }
        };

        const RequestAccessApp = {
            components: {
                AppLayout
            },
            setup() {
                const handleQuickAction = (action) => {
                    switch(action) {
                        case 'renew-permissions':
                            window.location.href = 'renew-permissions.html';
                            break;
                        default:
                            utils.showNotification(`${action} functionality would be implemented here`, 'info');
                    }
                };

                return {
                    handleQuickAction,
                    utils
                };
            },
            template: `
                <AppLayout page-title="Request Access" current-page="request-access" @quick-action="handleQuickAction">
                    <div class="page-header">
                        <h2>Request Access</h2>
                        <p>Browse available institutions and request access to their services</p>
                    </div>

                    <div class="institutions-grid">
                        <!-- PaymentApp Pro -->
                        <div class="institution-card">
                            <div class="institution-header">
                                <div class="institution-logo paymentapp">PAY</div>
                                <div class="institution-info">
                                    <h3>PaymentApp Pro</h3>
                                    <div class="institution-status">
                                        <i class="fas fa-check-circle verified"></i>
                                        <span>Verified Financial Service</span>
                                    </div>
                                </div>
                                <button class="btn-request" onclick="requestAccess('paymentapp')">
                                    <i class="fas fa-plus"></i>
                                    Request Access
                                </button>
                            </div>
                            
                            <div class="permissions-granted">
                                <h4>Current Permissions:</h4>
                                <div class="permission-list">
                                    <div class="permission-item granted">
                                        <i class="fas fa-credit-card"></i>
                                        <span>Payment Processing</span>
                                        <div class="permission-status">Active</div>
                                    </div>
                                    <div class="permission-item granted">
                                        <i class="fas fa-history"></i>
                                        <span>Transaction History</span>
                                        <div class="permission-status">Active</div>
                                    </div>
                                    <div class="permission-item granted">
                                        <i class="fas fa-chart-line"></i>
                                        <span>Spending Analytics</span>
                                        <div class="permission-status">Active</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- BudgetTracker -->
                        <div class="institution-card">
                            <div class="institution-header">
                                <div class="institution-logo budgettracker">BUD</div>
                                <div class="institution-info">
                                    <h3>BudgetTracker</h3>
                                    <div class="institution-status">
                                        <i class="fas fa-check-circle verified"></i>
                                        <span>Verified Budget Management</span>
                                    </div>
                                </div>
                                <button class="btn-request" onclick="requestAccess('budgettracker')">
                                    <i class="fas fa-plus"></i>
                                    Request Access
                                </button>
                            </div>
                            
                            <div class="permissions-granted">
                                <h4>Current Permissions:</h4>
                                <div class="permission-list">
                                    <div class="permission-item granted">
                                        <i class="fas fa-wallet"></i>
                                        <span>Account Balance</span>
                                        <div class="permission-status">Active</div>
                                    </div>
                                    <div class="permission-item granted">
                                        <i class="fas fa-chart-pie"></i>
                                        <span>Spending Categories</span>
                                        <div class="permission-status">Active</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ExpenseManager -->
                        <div class="institution-card">
                            <div class="institution-header">
                                <div class="institution-logo expensemanager">EXP</div>
                                <div class="institution-info">
                                    <h3>ExpenseManager</h3>
                                    <div class="institution-status">
                                        <i class="fas fa-check-circle verified"></i>
                                        <span>Verified Expense Tracking</span>
                                    </div>
                                </div>
                                <button class="btn-request" onclick="requestAccess('expensemanager')">
                                    <i class="fas fa-plus"></i>
                                    Request Access
                                </button>
                            </div>
                            
                            <div class="permissions-granted">
                                <h4>Current Permissions:</h4>
                                <div class="permission-list">
                                    <div class="permission-item granted">
                                        <i class="fas fa-receipt"></i>
                                        <span>Transaction Data</span>
                                        <div class="permission-status">Active</div>
                                    </div>
                                    <div class="permission-item pending">
                                        <i class="fas fa-camera"></i>
                                        <span>Receipt Scanning</span>
                                        <div class="permission-status">Pending</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </AppLayout>
            `
        };

        createApp(RequestAccessApp).mount('#app');
    </script>
</body>
</html>
